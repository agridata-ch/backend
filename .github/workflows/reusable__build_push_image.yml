on:
  workflow_call:
    inputs:
      account-id:
        required: true
        type: string
      ecr-repository-name:
        required: true
        type: string
      version:
        required: true
        type: string
        description: "Version tag for the Docker image"
    outputs:
      image:
        value: ${{ jobs.build-push-image.outputs.image }}

jobs:
  build-push-image:
    name: Build and push docker image
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      image: ${{ steps.push-image.outputs.image }}
    env:
      AWS_REGION: eu-central-2
      ECR_REPOSITORY: ${{inputs.ecr-repository-name}}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ format('v{0}', inputs.version) }}

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'corretto'

      - name: Restore Maven Cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Maven package
        run: mvn -B clean package -DskipTests -T 1C

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{inputs.account-id}}:role/agridata-application-deployment-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to AWS ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Layer-cache the base image + apk security layer across runs (GHA cache),
      # then push the built image to ECR.
      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ inputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Expose pushed image reference
        id: push-image
        run: echo "image=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ inputs.version }}" >> "$GITHUB_OUTPUT"
