name: CI/CD Pipeline Develop

on:
  pull_request:
    branches: [ develop ]
  push:
    branches: [ develop ]
  merge_group:
    branches: [ develop ]

jobs:
  check-single-commit:
    name: "."
    uses: ./.github/workflows/reusable__check_single_commit.yml
    secrets: inherit

  check-commit-message:
    name: "."
    uses: ./.github/workflows/reusable__check_commit_message.yml
    secrets: inherit

  checkstyle:
    name: "."
    uses: ./.github/workflows/reusable__checkstyle.yml
    needs: [ check-single-commit, check-commit-message ]
    secrets: inherit

  check-comments:
    name: "."
    uses: ./.github/workflows/reusable__check_comments.yml
    needs: [ check-single-commit, check-commit-message ]
    secrets: inherit

  gitleaks:
    name: "."
    uses: ./.github/workflows/reusable__gitleaks.yml
    needs: [ check-single-commit, check-commit-message ]
    secrets: inherit

  owasp-dependency-check:
    if: github.event_name == 'pull_request'
    name: "."
    uses: ./.github/workflows/reusable__owasp_dependency_check.yml
    needs: [ checkstyle, check-comments, gitleaks ]
    secrets: inherit

  unit-tests:
    name: "."
    uses: ./.github/workflows/reusable__unit_tests.yml
    needs: [ checkstyle, check-comments, gitleaks ]
    secrets: inherit

  quarkus-tests:
    name: "."
    uses: ./.github/workflows/reusable__quarkus_tests_sharded.yml
    needs: [ checkstyle, check-comments, gitleaks ]
    secrets: inherit

  coverage-sonarqube:
    name: "."
    uses: ./.github/workflows/reusable__coverage_sonarqube.yml
    needs: [ unit-tests, quarkus-tests ]
    secrets: inherit

  trivy-image-scan:
    if: github.event_name == 'pull_request'
    name: "."
    uses: ./.github/workflows/reusable__trivy_image_scan.yml
    needs: [ checkstyle, check-comments, gitleaks ]
    secrets: inherit

  semantic-release:
    if: github.ref == 'refs/heads/develop'
    name: "."
    uses: ./.github/workflows/reusable__semantic_release.yml
    needs: [ coverage-sonarqube ]
    secrets: inherit

  build-push-image:
    if: github.ref == 'refs/heads/develop'
    name: "."
    uses: ./.github/workflows/reusable__build_push_image.yml
    needs: [ semantic-release ]
    with:
      account-id: 183295418748 # production
      ecr-repository-name: backend
      version: ${{ needs.semantic-release.outputs.version }}
    secrets: inherit

  deploy:
    if: github.ref == 'refs/heads/develop'
    name: "."
    uses: ./.github/workflows/reusable__deploy.yml
    needs: build-push-image
    with:
      account-id: 108782064107 # develop
      image: ${{needs.build-push-image.outputs.image}}
      cluster: agridata-ecs-cluster
    secrets: inherit
