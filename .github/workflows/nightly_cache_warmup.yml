name: Nightly Cache Warmup

on:
  schedule:
    - cron: '0 2 * * *'   # 02:00 UTC, runs against the default branch (develop)
  workflow_dispatch:

jobs:
  warm-maven-cache:
    name: Warm Maven cache (deps + OWASP NVD DB)
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'corretto'

      - name: Restore previous cache (warm start)
        uses: actions/cache/restore@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ github.run_id }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Populate Maven dependencies and plugins
        run: mvn -B verify -DskipTests -DskipITs -T 1C

      - name: Update OWASP NVD database
        run: |
          mvn -B org.owasp:dependency-check-maven:update-only \
            -DnvdApiDelay=8000 \
            -DnvdMaxRetryCount=50 \
            -DnvdApiKey=${{ secrets.API_KEY_NATIONAL_VULNERABILITY_DATABASE }}

      - name: Save Maven cache
        uses: actions/cache/save@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ github.run_id }}

  warm-trivy-cache:
    name: Warm Trivy vulnerability DB cache
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Setup oras
        uses: oras-project/setup-oras@v1

      - name: Download and extract the vulnerability DB
        run: |
          mkdir -p $GITHUB_WORKSPACE/.cache/trivy/db
          oras pull ghcr.io/aquasecurity/trivy-db:2
          tar -xzf db.tar.gz -C $GITHUB_WORKSPACE/.cache/trivy/db
          rm db.tar.gz

      - name: Download and extract the Java DB
        run: |
          mkdir -p $GITHUB_WORKSPACE/.cache/trivy/java-db
          oras pull ghcr.io/aquasecurity/trivy-java-db:1
          tar -xzf javadb.tar.gz -C $GITHUB_WORKSPACE/.cache/trivy/java-db
          rm javadb.tar.gz

      - name: Save Trivy cache
        uses: actions/cache/save@v5
        with:
          path: ${{ github.workspace }}/.cache/trivy
          key: cache-trivy-${{ github.run_id }}

  # Pre-pull the Quarkus DevServices images so the @QuarkusTest shards docker-load them
  # instead of pulling from the registry during boot. Image tags are pinned in
  # src/main/resources/application.yml (quarkus.datasource/keycloak.devservices.image-name)
  # and MUST be kept in sync with the tags below.
  warm-devservices-images:
    name: Warm Quarkus DevServices image cache
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Pull and save DevServices images
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.cache/devservices"
          docker pull postgres:18
          docker pull quay.io/keycloak/keycloak:26.6.2
          docker save -o "$GITHUB_WORKSPACE/.cache/devservices/images.tar" \
            postgres:18 quay.io/keycloak/keycloak:26.6.2

      - name: Save DevServices image cache
        uses: actions/cache/save@v5
        with:
          path: ${{ github.workspace }}/.cache/devservices
          key: devservices-images-${{ github.run_id }}

  # The warmup is a single point of dependency: if it fails silently, every CI run
  # degrades (stale Maven / NVD / Trivy / DevServices caches). Surface it as a tracking issue.
  notify-on-failure:
    name: Report warmup failure
    runs-on: ubuntu-latest
    needs: [ warm-maven-cache, warm-trivy-cache, warm-devservices-images ]
    if: failure()
    permissions:
      issues: write
    steps:
      - name: Open or update tracking issue
        uses: actions/github-script@v9
        with:
          script: |
            const label = "ci-warmup-failure";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `Nightly cache warmup failed.\n\n` +
              `Run: ${runUrl}\n\n` +
              `Until this is fixed, CI runs degrade (stale Maven / NVD / Trivy / DevServices caches).`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: label,
            });
            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: "Nightly cache warmup failed",
                body,
                labels: [ label ],
              });
            }
