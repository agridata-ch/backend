on:
  workflow_call:

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'corretto'

      - name: Restore Maven Cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # Only the fast ch.agridata.** unit tests; the @QuarkusTest integration tests
      # (package integration.**) run sharded in reusable__quarkus_tests_sharded.yml.
      - name: Run unit tests
        run: mvn -B -Pci-unit test

      # Coverage is produced distributed and merged later in the coverage-sonarqube job.
      - name: Upload coverage data
        uses: actions/upload-artifact@v7
        with:
          name: coverage-unit
          path: target/*.exec
          if-no-files-found: error
          retention-days: 1
